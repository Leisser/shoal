name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      sweep_units:
        description: "Max units for the scaling sweep"
        default: "16"
      sweep_work:
        description: "CPU iterations per sweep point"
        default: "40000000"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the real matrix is interpreter build, not platform: shoal is pure Python
        python: ["3.12", "3.13", "3.14", "3.13t", "3.14t"]
    name: test py${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: doctor smoke test
        run: shoal doctor --no-colour
      - name: serve planner smoke test
        run: |
          cat > /tmp/smoke.py <<'PY'
          def application(environ, start_response): ...
          async def asgi_app(scope, receive, send): ...
          PY
          PYTHONPATH=/tmp shoal serve smoke:application --dry-run
          PYTHONPATH=/tmp shoal serve smoke:asgi_app --dry-run
      - name: gil probe smoke test
        run: shoal gil json --no-colour

      # Audit against a real gunicorn, three ways round. The only test that
      # parses /proc for a process shoal did not start.
      - name: audit a real deployment
        if: runner.os == 'Linux'
        run: |
          pip install gunicorn
          cat > /tmp/wsgiapp.py <<'PY'
          import json, decimal, uuid, datetime          # give it something to share
          def application(environ, start_response):
              start_response("200 OK", [("Content-Type", "text/plain")])
              return [b"ok"]
          PY
          cat > /tmp/frozen.py <<'PY'
          import gc
          def when_ready(server):
              gc.freeze()
          PY

          check () {                    # $1 label, $2 port, $3 expected, rest: args
            local label=$1 port=$2 want=$3; shift 3
            echo "--- $label: expect $want ---"
            PYTHONPATH=/tmp gunicorn --workers 4 --bind "127.0.0.1:$port" \
                     "$@" wsgiapp:application &
            for _ in $(seq 40); do
              if curl -sf -o /dev/null "http://127.0.0.1:$port/"; then break; fi
              sleep 0.5
            done
            curl -sf -o /dev/null "http://127.0.0.1:$port/" \
              || { echo "server never came up on $port"; return 1; }
            shoal audit --no-colour | tee "$label.txt" || true
            pkill -f "bind 127.0.0.1:$port" || true
            sleep 2
            grep -q "$want" "$label.txt"
          }

          check bare 8710 "NOT SHARING"
          check pre  8720 "DECAYING"   --preload
          check good 8730 "GOOD"       --preload -c /tmp/frozen.py

      - name: Publish audit results
        if: always() && runner.os == 'Linux'
        run: |
          {
            echo "## audit — py${{ matrix.python }}"
            for f in bare pre good; do
              [ -f "$f.txt" ] && { echo "### $f"; echo '```'; cat "$f.txt"; echo '```'; }
            done
          } >> "$GITHUB_STEP_SUMMARY" || true

  # The thesis is a measurement, so measure it on every push. Case A is memory,
  # Case C is whether that memory saving is usable. Neither alone decides anything.
  collapse:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14", "3.14t"]
    name: collapse py${{ matrix.python }}
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Case A - memory (PSS)
        run: python bench/collapse.py caseA --n 32 --settle 3 | tee caseA.txt
      - name: Case C - throughput
        run: python bench/collapse.py caseC --n 8 --work 40000000 | tee caseC.txt
      - name: Case D - a real app under load
        run: python bench/realapp.py compare --n 8 --requests 6000 --concurrency 8 | tee caseD.txt
      - name: Case E - worker-count sweep on a real app
        run: python bench/realapp.py sweep --max 16 --requests 2000 --concurrency 16 | tee caseE.txt
      - name: Case F - is the per-thread cost the allocator?
        run: python bench/threadcost.py compare --threads 16 --alloc-mb 8 | tee caseF.txt
      - name: Publish to run summary
        if: always()
        run: |
          {
            echo "## collapse — py${{ matrix.python }} (${{ runner.name }})"
            echo '```'; cat caseA.txt caseC.txt caseD.txt caseE.txt caseF.txt 2>/dev/null; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collapse-${{ matrix.python }}
          path: case*.txt

  # Scaling needs cores. A 2-core hosted runner caps every speedup at ~2x, which
  # tells you nothing about the interpreter -- processes hit the same wall.
  #
  # Set the repository variable LARGE_RUNNER to answer the scaling question:
  #   gh variable set LARGE_RUNNER --body "ubuntu-latest-8-cores"   # GitHub larger runner
  #   gh variable set LARGE_RUNNER --body "self-hosted"             # your own machine
  # Left unset it still runs, and honestly reports that the ceiling was too low.
  scaling:
    runs-on: ${{ vars.LARGE_RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14", "3.14t"]
    name: scaling py${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Report the machine
        run: |
          python - <<'PY'
          import sys; sys.path.insert(0, "bench")
          from collapse import usable_cores
          n, why = usable_cores()
          print(f"usable cores: {n} ({why})")
          PY
      - name: Scaling sweep
        run: |
          python bench/collapse.py sweep \
            --n ${{ github.event.inputs.sweep_units || '16' }} \
            --work ${{ github.event.inputs.sweep_work || '40000000' }} | tee sweep.txt
      - name: Publish to run summary
        if: always()
        run: |
          {
            echo "## scaling — py${{ matrix.python }} on ${{ vars.LARGE_RUNNER || 'ubuntu-latest' }}"
            echo '```'; cat sweep.txt 2>/dev/null; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scaling-${{ matrix.python }}
          path: sweep.txt
