name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the real matrix is interpreter build, not platform: unfork is pure Python
        python: ["3.12", "3.13", "3.14", "3.13t", "3.14t"]
    name: test py${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: doctor smoke test
        run: unfork doctor --no-colour

  # The thesis is a measurement, so measure it on every push. Case A is memory,
  # Case C is whether that memory saving is usable. Both are needed; neither
  # alone decides anything.
  collapse:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14", "3.14t"]
    name: collapse py${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Case A - memory (PSS, Linux)
        id: mem
        run: |
          python bench/collapse.py caseA --n 32 --settle 3 | tee caseA.txt

      - name: Case C - throughput
        run: |
          python bench/collapse.py caseC --n 8 --work 40000000 | tee caseC.txt

      - name: Publish to run summary
        if: always()
        run: |
          {
            echo "## collapse — python ${{ matrix.python }}"
            echo '```'
            cat caseA.txt caseC.txt 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collapse-${{ matrix.python }}
          path: case*.txt
